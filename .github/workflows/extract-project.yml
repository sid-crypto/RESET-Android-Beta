name: Extract RESET Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o RESET-Android-Beta.zip -d extracted

          if [ -d "extracted/RESET-Android-Beta" ]; then
            cp -r extracted/RESET-Android-Beta/. .
          else
            cp -r extracted/. .
          fi

          rm -rf extracted
          rm -f RESET-Android-Beta.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract RESET Android Beta project"
            git push
          fi
