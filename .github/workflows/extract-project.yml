name: Check RESET ZIP

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect uploaded files
        run: |
          echo "===== FILE LIST ====="
          ls -lah

          echo "===== ZIP INFO ====="
          file RESET-Android-Beta.zip || true

          echo "===== ZIP TEST ====="
          unzip -t RESET-Android-Beta.zip || true

          echo "===== ZIP SIZE ====="
          du -h RESET-Android-Beta.zip || true
