name: Extract RESET Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RESET ZIP
        run: |
          set -e

          echo "Checking ZIP..."
          test -f RESET-Android-Beta.zip

          echo "Testing ZIP..."
          unzip -t RESET-Android-Beta.zip

          rm -rf _reset_extract
          mkdir _reset_extract

          echo "Extracting..."
          unzip -q RESET-Android-Beta.zip -d _reset_extract

          echo "Moving project files..."

          if [ -d "_reset_extract/RESET-Android-Beta" ]; then
            cp -a _reset_extract/RESET-Android-Beta/app .
            cp -a _reset_extract/RESET-Android-Beta/build.gradle .
            cp -a _reset_extract/RESET-Android-Beta/settings.gradle .
            cp -a _reset_extract/RESET-Android-Beta/gradle.properties .
            cp -a _reset_extract/RESET-Android-Beta/README.md .
          else
            cp -a _reset_extract/app .
            cp -a _reset_extract/build.gradle .
            cp -a _reset_extract/settings.gradle .
            cp -a _reset_extract/gradle.properties .
            cp -a _reset_extract/README.md .
          fi

          echo "Removing ZIP..."
          rm -f RESET-Android-Beta.zip
          rm -rf _reset_extract

          echo "Final files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            -print | sort

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app build.gradle settings.gradle gradle.properties README.md RESET-Android-Beta.zip

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract RESET Android project"

          git push origin main
